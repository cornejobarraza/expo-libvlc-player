appId: ${APP_ID}
---
- launchApp:
    clearState: true

- assertVisible:
    id: "poster"

- extendedWaitUntil:
    notVisible:
      id: "poster"
    timeout: 3_600

- assertVisible:
    id: "pause"

- tapOn:
    id: "pause"
- extendedWaitUntil:
    visible:
      id: "play"
    timeout: 3_600

- tapOn:
    id: "play"
- extendedWaitUntil:
    visible:
      id: "pause"
    timeout: 3_600

- tapOn:
    id: "stop"
- extendedWaitUntil:
    visible:
      id: "play"
    timeout: 3_600

- assertVisible:
    id: "poster"
